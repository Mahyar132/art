<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title> Art </title>

<style>
:root{
    --bg:#0f1115;
    --text:#e6e8eb;
    --dim:#8b919a;
    --accent:#7aa2f7;
    --line:#292d35;
    --mono:Consolas,"Courier New",monospace;
}

*{box-sizing:border-box}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

header,main,footer{
    max-width:1000px;
    margin:auto;
}

header{
    padding:48px 24px 24px;
}

h1{
    margin:0 0 6px;
    color:#00AFF0;
    font:700 30px var(--mono);
}

header p{
    margin:0;
    color:var(--dim);
}

nav{
    position:sticky;
    top:0;
    z-index:2;
    background:rgba(15,17,21,.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
}

nav a.active{
    background:#007bff;
    border-color:#007bff;
    color:#fff;
}

nav ul{
    display:flex;
    gap:6px;
    max-width:1000px;
    margin:auto;
    padding:10px 24px;
    overflow:auto;
    list-style:none;
}

nav a{
    display:block;
    padding:6px 11px;
    border:1px solid var(--line);
    border-radius:4px;
    color:var(--dim);
    font:13px var(--mono);
    text-decoration:none;
    white-space:nowrap;
}

nav a:hover{
    color:var(--text);
    border-color:#3a404b;
}

main{
    padding:36px 24px 48px;
}

.status{
    margin:0 0 20px;
    color:var(--dim);
    font:12px var(--mono);
}

.gallery{
    columns:4 180px;
    column-gap:12px;
}

.item{
    display:block;
    margin:0 0 12px;
    overflow:hidden;
    break-inside:avoid;
    background:#171a20;
    border-radius:4px;
}

.item img{
    display:block;
    width:100%;
    height:auto;
}

.item:hover img{
    opacity:.8;
}

.comments{
    margin-top:48px;
    padding-top:24px;
    border-top:1px solid var(--line);
}

.comments h2{
    margin:0 0 18px;
    color:var(--text);
    font:700 16px var(--mono);
}

.comments p{
    margin:0 0 18px;
    color:var(--dim);
    font:12px var(--mono);
}

footer{
    padding:32px 24px 48px;
    color:var(--dim);
    font-size:12px;
}

.footer-grid{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px 18px;
}

.footer-line{
    height:1px;
    margin:14px 0;
    background:var(--line);
}

@media(max-width:700px){
    .gallery{columns:3 140px}
}

@media(max-width:480px){
    header{padding-top:36px}
    h1{font-size:24px}
    main{padding:28px 12px 40px}
    nav ul{padding-left:12px;padding-right:12px}
    .gallery{columns:2 120px;column-gap:8px}
    .item{margin-bottom:8px}
    footer{padding:28px 18px 36px}
}
</style>
</head>

<body>

<header>
    <h1> Isotope Gallery </h1>
    <p> Smells like a booru in here... </p>
</header>

<nav>
    <ul>
        <li><a href="https://mahyar132.github.io/">Home</a></li>
        <li><a href="https://mahyar132.github.io/about/">About</a></li>
        <li><a href="https://mahyar132.github.io/projects/">Projects</a></li>
        <li><a href="https://mahyar132.github.io/contact/">Contact</a></li>
        <li><a class="active" href="https://mahyar132.github.io/art/">Art</a></li>
    </ul>
</nav>

<main>
    <p class="status" id="status">Loading artwork...</p>
    <div class="gallery" id="gallery"></div>

    <section class="comments">
        <h2>Comments</h2>
        <p>Leave a comment or share your thoughts.</p>

        <script src="https://giscus.app/client.js"
                data-repo="gamma984/Comments"
                data-repo-id="R_kgDOT1oikw"
                data-category="Announcements"
                data-category-id="DIC_kwDOT1oik84DDKwW"
                data-mapping="pathname"
                data-strict="0"
                data-reactions-enabled="1"
                data-emit-metadata="0"
                data-input-position="bottom"
                data-theme="preferred_color_scheme"
                data-lang="en"
                crossorigin="anonymous"
                async>
        </script>
    </section>
</main>

<footer>
    <div class="footer-grid">
        <span> Mahyar </span>
        <span> Under Development </span>
    </div>

    <div class="footer-line"></div>

    Copyright © 2026 - <span id="year"></span> Mahyar Projects
</footer>

<script>
const repo="mahyar132/art";
const types=/\.(jpe?g|png|webp|gif|avif|svg)$/i;
const gallery=document.getElementById("gallery");
const status=document.getElementById("status");

fetch(`https://api.github.com/repos/${repo}/git/trees/HEAD?recursive=1`)
.then(r=>{
    if(!r.ok) throw new Error();
    return r.json();
})
.then(data=>{
    const files=data.tree.filter(
        f=>f.type==="blob" && types.test(f.path)
    );

    if(!files.length){
        status.textContent="No artwork found.";
        return;
    }

    status.textContent=`${files.length} artwork${files.length>1?"s":""}`;

    files.forEach(file=>{
        const name=file.path.split("/").pop();
        const url=`https://raw.githubusercontent.com/${repo}/HEAD/${file.path}`;

        const link=document.createElement("a");
        link.className="item";
        link.href=url;
        link.download=name;
        link.target="_blank";

        const img=document.createElement("img");
        img.src=url;
        img.alt=name;
        img.loading="lazy";

        link.appendChild(img);
        gallery.appendChild(link);
    });
})
.catch(()=>{
    status.textContent="Unable to load artwork.";
});

document.getElementById("year").textContent=new Date().getFullYear();
</script>

</body>
</html>
